name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: goalpilot_local
          POSTGRES_USER: goalpilot_local
          POSTGRES_PASSWORD: goalpilot_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goalpilot_local -d goalpilot_local"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: local
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:5173
      API_ORIGIN: http://localhost:3000
      API_PORT: 3000
      DATABASE_URL: postgres://goalpilot_local:goalpilot_local_only@localhost:5432/goalpilot_local
      TEST_DATABASE_URL: postgres://goalpilot_local:goalpilot_local_only@localhost:5432/goalpilot_test
      AUTH_MODE: local
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
      FINANCIAL_PROVIDER_MODE: simulated
      APPLICATION_DATE: 2026-08-23
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:migrate
      - run: corepack pnpm db:seed
      - run: corepack pnpm verify
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-release-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
