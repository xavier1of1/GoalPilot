services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: goalpilot_local
      POSTGRES_USER: goalpilot_local
      POSTGRES_PASSWORD: goalpilot_local_only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - goalpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goalpilot_local -d goalpilot_local']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  goalpilot_postgres_data:
